<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Core Brand Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="electricPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="256" height="256" rx="58" fill="url(#bg)" stroke="#1e2436" stroke-width="2.5" />
  <rect x="2" y="2" width="252" height="252" rx="56" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Ambient Ambient Glows -->
  <circle cx="128" cy="128" r="75" fill="#4f46e5" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="128" cy="128" r="45" fill="#06b6d4" opacity="0.2" filter="url(#coreGlow)" />

  <!-- Outer HUD Ring Matrix -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="128" cy="128" r="82" fill="none" stroke="rgba(168, 85, 247, 0.12)" stroke-width="1" />

  <!-- Dynamic Swirling Orbital Rings (Multi-Account Pool Symbol) -->
  <ellipse cx="128" cy="128" rx="100" ry="38" transform="rotate(-32 128 128)" fill="none" stroke="url(#cyanPurple)" stroke-width="4.5" filter="url(#coreGlow)" />
  <ellipse cx="128" cy="128" rx="98" ry="36" transform="rotate(38 128 128)" fill="none" stroke="url(#neonEmerald)" stroke-width="3" stroke-dasharray="16 8" />
  <ellipse cx="128" cy="128" rx="94" ry="32" transform="rotate(85 128 128)" fill="none" stroke="url(#electricPink)" stroke-width="2.5" opacity="0.75" />

  <!-- Central Glass Hexagon/Orb Plaque -->
  <circle cx="128" cy="128" r="46" fill="#0e1322" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" filter="url(#coreGlow)" />
  <circle cx="128" cy="128" r="44" fill="url(#cyanPurple)" opacity="0.22" />

  <!-- Stylized "A" Monogram (AgyPool) -->
  <path d="M128 94 L152 152 H139.5 L134.5 139 H121.5 L116.5 152 H104 Z M124 128.5 H132 L128 116 Z" fill="url(#monogramGrad)" filter="url(#coreGlow)" />

  <!-- Active Quota Nodes & Orbiting Particles -->
  <circle cx="128" cy="46" r="4.5" fill="#00f2fe" filter="url(#coreGlow)" />
  <circle cx="210" cy="128" r="3.5" fill="#10b981" filter="url(#coreGlow)" />
  <circle cx="46" cy="128" r="3" fill="#a855f7" filter="url(#coreGlow)" />
  <circle cx="128" cy="210" r="4" fill="#38bdf8" />

  <!-- Top Glass Highlight Reflection -->
  <path d="M30 40 C60 18 196 18 226 40 C200 70 56 70 30 40 Z" fill="#ffffff" opacity="0.04" />
</svg>
